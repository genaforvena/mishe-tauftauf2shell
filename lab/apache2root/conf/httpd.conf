# php2shell rung 2 — self-contained lab Apache (prefork + ASan mod_php).
# Started as the current user, loopback only. No /etc/apache2 involvement.
ServerRoot "/home/mesh-home/mishe-tauftauf2shell/lab/apache2root"
Listen 127.0.0.1:18099
PidFile logs/httpd.pid
Timeout 60
KeepAlive Off
ServerName 127.0.0.1:18099

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
# one child, never recycled: every request is answered by the same worker
# (top-level, after the MPM LoadModule — an <IfModule> block here was
# silently skipped on noble, leaving prefork defaults: 5 workers.)
StartServers          1
MinSpareServers        1
MaxSpareServers        1
MaxRequestWorkers      1
MaxRequestsPerChild    0

#LoadModule php_module PHPLIB

User mesh-home
Group mesh-home

ErrorLog logs/error_log
LogLevel debug
LogFormat "%h %u %t \"%r\" %>s %b" common
CustomLog logs/access_log common

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/home/mesh-home/mishe-tauftauf2shell/lab/apache2root/htdocs"
<Directory "/home/mesh-home/mishe-tauftauf2shell/lab/apache2root/htdocs">
    Require all granted
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

PHPIniDir "/home/mesh-home/mishe-tauftauf2shell/lab/apache2root/conf"
