id = spawnd {
    background = no
    single process = yes
    listen { address = 127.0.0.1; port = 4949 }
}

id = tac_plus-ng {
    host world {
        address = 0.0.0.0/0
        key = demo
    }

    profile admin {
        script {
            if (service == shell) {
                permit
            }
        }
    }

    user demo {
        password login = clear demo
        password pap = login
        profile = admin
    }
}
