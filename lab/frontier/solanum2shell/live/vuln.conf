serverinfo {
	name = "link.a.";
	sid = "1AA";
	description = "Lab vulnerable Solanum";
	network_name = "LabNet";
	vhost = "127.0.0.1";
};

admin {
	name = "Lab";
	description = "Loopback lab server";
	email = "root@localhost";
};

class "users" {
	ping_time = 5 minutes;
	number_per_ip = 100;
	max_number = 200;
	sendq = 100kb;
};

class "server" {
	ping_time = 5 minutes;
	connectfreq = 5 minutes;
	max_number = 3;
	sendq = 5 megabytes;
};

listen { host = "127.0.0.1"; port = 17601; };

auth { user = "*@127.0.0.0/8"; class = "users"; };

connect "link.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa." {
	host = "127.0.0.1";
	port = 17601;
	send_password = "labsecret";
	accept_password = "labsecret";
	class = "server";
	flags = topicburst;
};
