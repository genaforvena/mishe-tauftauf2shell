ServerName                      "Frontier UTF8TRANS Lab"
ServerType                      standalone
DefaultServer                   on
Port                            21874
UseIPv6                         off
User                            mesh-home
Group                           mesh-home
RootRevoke                      off
Umask                           022
MaxInstances                    4
TimesGMT                        off
WtmpLog                         off
UseFtpUsers                     off
UseReverseDNS                   off
RequireValidShell               off
AllowOverwrite                  on
MasqueradeAddress               127.0.0.1
PassivePorts                    21875 21880
ScoreboardFile                  /home/mesh-home/mishe-tauftauf2shell/lab/frontier/proftpd2shell/wire/run/scoreboard
PidFile                         /home/mesh-home/mishe-tauftauf2shell/lab/frontier/proftpd2shell/wire/run/proftpd.pid
SystemLog                       /home/mesh-home/mishe-tauftauf2shell/lab/frontier/proftpd2shell/wire/log/system.log

AuthOrder                       mod_auth_file.c
AuthUserFile                    /home/mesh-home/mishe-tauftauf2shell/lab/frontier/proftpd2shell/wire/etc/ftpd.passwd
AuthGroupFile                   /home/mesh-home/mishe-tauftauf2shell/lab/frontier/proftpd2shell/wire/etc/ftpd.group

<IfModule mod_delay.c>
  DelayEngine                   off
</IfModule>

<Directory ~>
  AllowOverwrite                on
  <Limit ALL>
    AllowAll
  </Limit>
</Directory>

<IfModule mod_rewrite.c>
  RewriteEngine                 on
  RewriteLog                    /home/mesh-home/mishe-tauftauf2shell/lab/frontier/proftpd2shell/wire/log/rewrite.log
  RewriteMap                    u8 int:utf8trans
  RewriteCondition              %m STOR
  RewriteRule                   ^(.*) ${u8:$1}
</IfModule>
