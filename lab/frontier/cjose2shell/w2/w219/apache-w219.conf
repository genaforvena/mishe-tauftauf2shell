ServerRoot "@W2@"
ServerName 127.0.0.1
Listen 127.0.0.1:18444
PidFile "@T@/apache.pid"
ErrorLog "@T@/evidence/apache_error.log"
LogLevel debug
DefaultRuntimeDir "@T@/run"

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule reqtimeout_module /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule auth_openidc_module "@W2@/mod_auth_openidc/.libs/mod_auth_openidc.so"

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    MaxConnectionsPerChild 0
</IfModule>

DocumentRoot "@T@/html"
<Directory "@T@/html">
    Require all granted
</Directory>

OIDCProviderIssuer "https://127.0.0.1:18444/issuer"
OIDCRedirectURI "http://127.0.0.1:18444/redirect_uri"
OIDCProviderAuthorizationEndpoint "https://127.0.0.1:18444/authorize"
OIDCClientSecret "0123456789abcdef"
OIDCClientID "w2-loopback-rp"
OIDCCryptoPassphrase "w2-lab-passphrase-0123456789"
OIDCCacheType file
OIDCCacheDir "@T@/cache"

<Location /private>
    AuthType oauth20
    Require valid-user
</Location>
