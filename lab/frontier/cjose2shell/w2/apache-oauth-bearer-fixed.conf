ServerRoot "@HERE@"
ServerName 127.0.0.1
Listen 127.0.0.1:18445
PidFile "@HERE@/apache-oauth-bearer-fixed.pid"
ErrorLog "@HERE@/evidence/oauth-bearer-fixed-apache_error.log"
LogLevel debug
DefaultRuntimeDir "/tmp/w2-apache-oauth-bearer-fixed-run"

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule reqtimeout_module /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule auth_openidc_module "@HERE@/mod_auth_openidc-fixed/.libs/mod_auth_openidc.so"

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    MaxConnectionsPerChild 0
</IfModule>

DocumentRoot "@HERE@/html"
<Directory "@HERE@/html">
    Require all granted
</Directory>

OIDCProviderIssuer "https://127.0.0.1:18445/issuer"
OIDCRedirectURI "http://127.0.0.1:18445/redirect_uri"
OIDCProviderAuthorizationEndpoint "https://127.0.0.1:18445/authorize"
OIDCClientID "w2-loopback-rp"
OIDCClientSecret "0123456789abcdef"
OIDCCryptoPassphrase "w2-lab-passphrase-0123456789"
OIDCCacheType file
OIDCCacheDir /tmp/w2-oidc-cache-oauth-bearer-fixed

<Location /private>
    AuthType oauth20
    Require valid-user
</Location>
